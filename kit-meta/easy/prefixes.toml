# Easy-name prefix dictionary for kit constants.
# Longest prefix wins; `module` limits a rule to one kit header (`tf_`, `sf_` and
# `mtf_` mean different things in different headers, e.g. troop vs text flags).
# Evidence lines were measured on target/uw-staging/atlas.json (3056 constants).

