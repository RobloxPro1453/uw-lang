# Scene records: `scene_flags` is a `flags:sf_` set (header_scenes.py single bits); every other
# field is the atlas value as it is.
# Field names and order follow the layout comment at the top of the kit's module_scenes.py
# (`source` points at it); docs/arsiv/meclis-yon1-yon2/YON2-KARAR.md §2.
table = "scenes"
kind = "scene"
id_prefix = "scn_"

[[fields]]
name = "id"
ty = "raw"
source = "module_scenes.py:9"

# Every scene flag is one bit: sf_indoors, sf_force_skybox, sf_generate, sf_randomize,
# sf_auto_entry_points, sf_no_horses, sf_muddy_water (header_scenes.py:13-19).
[[fields]]
name = "scene_flags"
ty = "flags:sf_"
source = "module_scenes.py:10"

[[fields]]
name = "mesh_name"
ty = "raw"
source = "module_scenes.py:11"

[[fields]]
name = "body_name"
ty = "raw"
source = "module_scenes.py:12"

# The kit spells these "Min-pos"/"Max-pos" (module_scenes.py:13-14); UW writes the full words.
[[fields]]
name = "min_position"
ty = "raw"
source = "module_scenes.py:13"

[[fields]]
name = "max_position"
ty = "raw"
source = "module_scenes.py:14"

[[fields]]
name = "water_level"
ty = "raw"
source = "module_scenes.py:15"

[[fields]]
name = "terrain_code"
ty = "raw"
source = "module_scenes.py:16"

[[fields]]
name = "passages"
ty = "raw"
source = "process_scenes.py:19"

[[fields]]
name = "chest_troops"
ty = "raw"
source = "module_scenes.py:21"

# The comment lists ten fields, but `random_scene_steppe` and its siblings carry an eleventh value:
# the outer terrain, which the kit reads as `scene[10]` (process_scenes.py:20,66). No kit comment
# names it, so the position stays `field_11`; absent from every other scene record.
[[fields]]
name = "field_11"
ty = "raw"
optional = true
source = "process_scenes.py:20"
