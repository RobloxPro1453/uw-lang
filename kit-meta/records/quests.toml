# Quest records: `quest_flags` is `flags:qf_`; every other field is still the atlas value as it is.
# Field names and order follow the layout comment at the top of the kit's module_quests.py
# (`source` points at it); §2.
table = "quests"
kind = "quest"
id_prefix = "qst_"

[[fields]]
name = "id"
ty = "raw"
source = "module_quests.py:5"

[[fields]]
name = "quest_name"
ty = "raw"
source = "module_quests.py:6"

[[fields]]
name = "quest_flags"
ty = "flags:qf_"
source = "module_quests.py:7"

[[fields]]
name = "description"
ty = "raw"
source = "module_quests.py:8"
