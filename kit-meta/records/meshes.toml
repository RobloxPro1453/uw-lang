# Mesh records: `mesh_flags` is a `flags:render_order_plus_1` set; every other field is the atlas
# value as it is.
# Field names and order follow the layout comment at the top of the kit's module_meshes.py
# (`source` points at it); docs/arsiv/meclis-yon1-yon2/YON2-KARAR.md §2.
table = "meshes"
kind = "mesh"
id_prefix = "mesh_"

[[fields]]
name = "id"
ty = "raw"
source = "module_meshes.py:5"

# The header's only mesh flag: render_order_plus_1 (header_meshes.py:8); every other record has 0.
[[fields]]
name = "mesh_flags"
ty = "flags:render_order_plus_1"
source = "module_meshes.py:6"

[[fields]]
name = "resource_name"
ty = "raw"
source = "module_meshes.py:7"

[[fields]]
name = "translation_x"
ty = "raw"
source = "module_meshes.py:8"

[[fields]]
name = "translation_y"
ty = "raw"
source = "module_meshes.py:9"

[[fields]]
name = "translation_z"
ty = "raw"
source = "module_meshes.py:10"

[[fields]]
name = "rotation_x"
ty = "raw"
source = "module_meshes.py:11"

[[fields]]
name = "rotation_y"
ty = "raw"
source = "module_meshes.py:12"

[[fields]]
name = "rotation_z"
ty = "raw"
source = "module_meshes.py:13"

[[fields]]
name = "scale_x"
ty = "raw"
source = "module_meshes.py:14"

[[fields]]
name = "scale_y"
ty = "raw"
source = "module_meshes.py:15"

[[fields]]
name = "scale_z"
ty = "raw"
source = "module_meshes.py:16"
