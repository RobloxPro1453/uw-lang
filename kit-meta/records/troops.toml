# Troop records: readable fields (T-059). Field names and order follow the layout comment at the top
# of the kit's module_troops.py (`source` points at it); docs/meclis/YON2-KARAR.md §2.
# Typed: troop_flags (a flag set), scene (site/entry packed number), faction (a faction ref),
# inventory (item refs), attributes, weapon_proficiencies and skills (packed numbers).
# The face codes (module_troops.py:30-32 says only "from the face generator") and the upgrade
# targets that upgrade() appends past position 14 (header_troops.py:266-273) stay raw.
table = "troops"
kind = "troop"
id_prefix = "trp_"
list = true

[[fields]]
name = "id"
ty = "raw"
source = "module_troops.py:13"

[[fields]]
name = "name"
ty = "raw"
source = "module_troops.py:14"

[[fields]]
name = "plural_name"
ty = "raw"
source = "module_troops.py:15"

# header_troops.py:10-31 lists the troop flag bits. The plain `tf_` prefix would also name the
# presentation text flags (header_presentations.py:9-17, same bit values: tf_center_justify is
# tf_hero), so the prefixes below spell the troop constants. tf_male is 0, hence `zero`.
[[fields]]
name = "troop_flags"
ty = "flags:tf_male,tf_female,tf_undead,tf_hero,tf_inactive,tf_unkillable,tf_allways_fall_dead,tf_no_capture_alive,tf_mounted,tf_is_merchant,tf_randomize_face,tf_guarantee_,tf_unmoveable_in_party_window"
zero = "tf_male"
source = "module_troops.py:16"

# `scn_reyvadin_castle|entry(1)` (module_troops.py:17): the site id is the low 16 bits and the entry
# point bits 16..23 (header_troops.py:82-87). The site stays a number: no_scene is 0
# (module_troops.py:133) but scenes index 0 is scn_random_scene (ID_scenes.py:1).
[[fields]]
name = "scene"
ty = "bits"
source = "module_troops.py:17"

[[fields.parts]]
name = "site"
shift = 0
width = 16
source = "header_troops.py:82"

[[fields.parts]]
name = "entry"
shift = 16
width = 8
source = "header_troops.py:83"

[[fields]]
name = "reserved"
ty = "raw"
source = "module_troops.py:18"

[[fields]]
name = "faction"
ty = "ref:factions"
source = "module_troops.py:19"

[[fields]]
name = "inventory"
ty = "list:ref:items"
source = "module_troops.py:20"

[[fields]]
name = "attributes"
ty = "bits"
source = "module_troops.py:21"

# process_troops.py:44-49 reads `attrib & 0xff`, `>> 8 & 0xff`, `>> 16 & 0xff`,
# `>> 24 & 0xff` and `>> level_bits & level_mask`; the masks are in header_troops.py.
# The kit spells the constants str_/agi_/int_/cha_ (header_troops.py:90-205); UW spells the names out.
[[fields.parts]]
name = "strength"
shift = 0
width = 8
source = "header_troops.py:90"

[[fields.parts]]
name = "agility"
shift = 8
width = 8
source = "header_troops.py:119"

[[fields.parts]]
name = "intelligence"
shift = 16
width = 8
source = "header_troops.py:148"

[[fields.parts]]
name = "charisma"
shift = 24
width = 8
source = "header_troops.py:178"

[[fields.parts]]
name = "level"
shift = 32
width = 8
source = "header_troops.py:208"

# Seven 10-bit fields (process_troops.py:53-58); the shifts are header_troops.py:218-224 and the
# 0x3FF mask is in every wp_* function (header_troops.py:227-240).
[[fields]]
name = "weapon_proficiencies"
ty = "bits"
source = "module_troops.py:23"

[[fields.parts]]
name = "one_handed"
shift = 0
width = 10
source = "header_troops.py:218"

[[fields.parts]]
name = "two_handed"
shift = 10
width = 10
source = "header_troops.py:219"

[[fields.parts]]
