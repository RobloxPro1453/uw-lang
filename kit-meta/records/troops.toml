# Troop records: the pilot of the readable field types (docs/meclis/YON2-KARAR.md §2).
# `faction` is a `ref:factions` and `attributes` a `bits` value (header_troops.py positions);
# every other field is still the atlas value as it is.
# Field names and order follow the layout comment at the top of the kit's module_troops.py
# (`source` points at it); docs/meclis/YON2-KARAR.md §2.
table = "troops"
kind = "troop"
id_prefix = "trp_"
list = true

[[fields]]
name = "id"
ty = "raw"
source = "module_troops.py:13"

[[fields]]
name = "name"
ty = "raw"
source = "module_troops.py:14"

[[fields]]
name = "plural_name"
ty = "raw"
source = "module_troops.py:15"

[[fields]]
name = "troop_flags"
ty = "raw"
source = "module_troops.py:16"

[[fields]]
name = "scene"
ty = "raw"
source = "module_troops.py:17"

[[fields]]
name = "reserved"
ty = "raw"
source = "module_troops.py:18"

[[fields]]
name = "faction"
ty = "ref:factions"
source = "module_troops.py:19"

[[fields]]
name = "inventory"
ty = "raw"
source = "module_troops.py:20"

[[fields]]
name = "attributes"
ty = "bits"
source = "module_troops.py:21"

# process_troops.py:44-49 reads `attrib & 0xff`, `>> 8 & 0xff`, `>> 16 & 0xff`,
# `>> 24 & 0xff` and `>> level_bits & level_mask`; the masks are in header_troops.py.
[[fields.parts]]
name = "str"
shift = 0
width = 8
source = "header_troops.py:90"

[[fields.parts]]
name = "agi"
shift = 8
width = 8
source = "header_troops.py:119"

[[fields.parts]]
name = "int"
shift = 16
width = 8
source = "header_troops.py:148"

[[fields.parts]]
name = "cha"
shift = 24
width = 8
source = "header_troops.py:178"

[[fields.parts]]
name = "level"
shift = 32
width = 8
source = "header_troops.py:208"

[[fields]]
name = "weapon_proficiencies"
ty = "raw"
source = "module_troops.py:23"

[[fields]]
name = "skills"
ty = "raw"
source = "module_troops.py:28"

[[fields]]
name = "face_code"
ty = "raw"
source = "module_troops.py:30"

[[fields]]
name = "face_code_2"
ty = "raw"
optional = true
source = "module_troops.py:31"

[[fields]]
name = "troop_image"
ty = "raw"
optional = true
source = "module_troops.py:33"
