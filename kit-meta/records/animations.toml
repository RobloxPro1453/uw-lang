# Animation records: `animation_flags` packs the `acf_` flags in bits 0-23 and the animation
# length in bits 24-31 (`acf_anim_length_bits` / `acf_anim_length_mask`); `animation_master_flags`
# is an `amf_` set. The id and the sequence list stay as they are.
# Field names and order follow the layout comment at the top of the kit's module_animations.py
# (`source` points at it); §2.
table = "animations"
kind = "animation"
id_prefix = "anim_"
list = true

[[fields]]
name = "id"
ty = "raw"
source = "module_animations.py:6"

[[fields]]
name = "animation_flags"
ty = "bits"
source = "module_animations.py:7"

[[fields.parts]]
name = "flags"
shift = 0
width = 24
ty = "flags:acf_"
source = "header_animations.py:119"

# The kit only names the acf_anim_length_* constants (header_animations.py:119-121).
[[fields.parts]]
name = "animation_length"
shift = 24
width = 8
source = "header_animations.py:121"

[[fields]]
name = "animation_master_flags"
ty = "flags:amf_"
# module_animations.py:8: master flags are anything beginning with amf_ in header_animations.py.
source = "module_animations.py:8"

[[fields]]
name = "animation_sequences"
ty = "raw"
source = "module_animations.py:9"
