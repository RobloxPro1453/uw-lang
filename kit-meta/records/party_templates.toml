# Party template records: the fields the kit explains are typed (the packed flag word, the faction
# reference and the packed personality); every other field is still the atlas value as it is.
# Field names and order follow the layout comment at the top of the kit's module_party_templates.py
# (`source` points at it); docs/arsiv/meclis-yon1-yon2/YON2-KARAR.md §2.
table = "party_templates"
kind = "party_template"
id_prefix = "pt_"

[[fields]]
name = "id"
ty = "raw"
source = "module_party_templates.py:11"

[[fields]]
name = "name"
ty = "raw"
source = "module_party_templates.py:13"

# The same packed word as `parties`: bits 0-7 the map icon (`pf_icon_mask`, header_parties.py:13,
# map_icons ids from ID_map_icons.py), bits 8-26 the `pf_*` flags (header_parties.py:14-32) and
# 48-63 the carry numbers.
[[fields]]
name = "party_flags"
ty = "bits"
source = "module_party_templates.py:14"

[[fields.parts]]
name = "icon"
shift = 0
width = 8
ty = "ref:map_icons"
source = "header_parties.py:13"

[[fields.parts]]
name = "flags"
shift = 8
width = 19
ty = "flags:pf_"
source = "header_parties.py:14"

[[fields.parts]]
name = "carry_goods"
shift = 48
width = 8
source = "header_parties.py:35"

[[fields.parts]]
name = "carry_gold"
shift = 56
width = 8
source = "header_parties.py:36"

# A value of 0 is `no_menu` (module_parties.py:28), the default encounter system
# (module_party_templates.py:15), not menu 0 (`menu_start_game_0`, ID_menus.py:1).
[[fields]]
name = "menu"
ty = "ref:menus"
none = 0
source = "module_party_templates.py:15"

[[fields]]
name = "faction"
ty = "ref:factions"
source = "module_party_templates.py:16"

# The three packed personality numbers: courage is bits 0-3 (header_parties.py:73-84),
# aggressiveness bits 4-7 (header_parties.py:86-101) and banditness bit 8 (header_parties.py:103).
# `courage_4`..`courage_15` are defined a second time in header_troops.py, so a `flags` enum group
# cannot name them uniquely; the packed parts stay readable and exact.
[[fields]]
name = "personality"
ty = "bits"
source = "module_party_templates.py:17"

[[fields.parts]]
name = "courage"
shift = 0
width = 4
source = "header_parties.py:73"

[[fields.parts]]
name = "aggressiveness"
shift = 4
width = 4
source = "header_parties.py:86"

[[fields.parts]]
name = "banditness"
shift = 8
width = 1
source = "header_parties.py:103"

# A stack is a tuple of (troop, min, max[, member flags]); the records core has no tuple element type.
[[fields]]
name = "stacks"
ty = "raw"
source = "module_party_templates.py:18"
