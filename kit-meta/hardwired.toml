# Records the game engine itself depends on, table by table: the records and positions a from-scratch
# mod (`base = "empty"`) has to keep, because the engine reads them by position, not by name.
#
# Every line carries kit evidence: `evidence` is a `file:line` in the kit rooted at
# `Module_system 1.171/`, and `position` is the record's index in the kit's `ID_<table>.py` — the kit
# writes ID = list index (`process_items.py:12-14`, `process_troops.py:99-102`,
# `process_strings.py:18-20`). Warband itself is closed source, so the engine's real expectation is
# only readable from the kit's own "hardwired / hardcoded" comments: docs/arsiv/meclis-yon1-yon2/kanit-H2.md collects
# them, docs/arsiv/meclis-yon1-yon2/denetim-H1.md marks what could not be verified.
#
# `certainty`:
#   "comment"  = a kit comment marks exactly this boundary.
#   "inferred" = no marker sits at this boundary; the need is read from other kit evidence.
#
# Checked by crates/uw_decomp/tests/hardwired_t122.rs (same id and position in the kit's ID file, and
# the id/position in `target/uw-staging/atlas.json` when that dump exists).

