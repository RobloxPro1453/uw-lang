[package]
name = "uw_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "uw"
path = "src/main.rs"

[dependencies]
uw_diag = { path = "../uw_diag" }
uw_atlas = { path = "../uw_atlas" }
uw_kitrun = { path = "../uw_kitrun" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
uw_syntax = { path = "../uw_syntax" }
uw_check = { path = "../uw_check" }
uw_emit = { path = "../uw_emit" }
uw_decomp = { path = "../uw_decomp" }
uw_easy = { path = "../uw_easy" }
